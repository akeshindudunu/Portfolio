# File: .github/workflows/publish.yml
name: publish-to-github-pages
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache dependencies
        id: cache_dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        shell: bash
        if: steps.cache_dependencies.outputs.cache-hit != 'true'
        run: npm ci

      - name: Setup Pages ⚙️
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Build with Next.js 🏗️
        run: npx next build

      - name: Prepare export directory
        shell: bash
        run: |
          set -euo pipefail
          echo "Looking for Next export/output directories..."
          if [ -d out ]; then
            echo "out already exists"
          elif [ -d .next/output/export ]; then
            echo "Found .next/output/export — moving to out"
            mv .next/output/export out
          elif [ -d .next/export ]; then
            echo "Found .next/export — moving to out"
            mv .next/export out
          elif [ -d .next/output/static ]; then
            echo "Found .next/output/static — copying to out"
            mkdir -p out
            cp -r .next/output/static/* out/
          elif [ -d .next/server/pages ]; then
            echo "Found .next/server/pages — copying to out"
            mkdir -p out
            cp -r .next/server/pages/* out/ || true
          else
            echo "::error::No static export directory found. Listing .next for debugging:"
            ls -la .next || true
            exit 1
          fi

      - name: Upload artifact 📡
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4